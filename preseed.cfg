#_preseed_V1

# SAE 51 - Preconfiguration Debian
# Installation automatique pour une VM de test VirtualBox.
#
# Compte de test :
#   utilisateur : sae51
#   mot de passe : debian
#
# ATTENTION : le partitionnement automatique utilise le disque
# de la machine virtuelle. Cette configuration est destinée au test.

# Langue, pays et clavier
d-i debian-installer/language string fr
d-i debian-installer/country string FR
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr

# Réseau
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-sae51
d-i netcfg/get_domain string local
d-i netcfg/disable_autoconfig boolean false

# Miroir Debian stable
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string stable
d-i mirror/udeb/suite string stable

# Horloge
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean true

# Comptes
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string SAE51
d-i passwd/username string sae51
d-i passwd/user-password-crypted password $6$SAE51tst$qfXw3zTnCLJfqht4DOQUQ2BHRpV9/8/2oEEWzpKgRzCYyZ/qzwkSMNa4O9oKZ3F4mNCuCRYiVz8bSuMa0nzmj1

# Partitionnement automatique du disque de la VM
d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/sda
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Chargeur de démarrage
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda

# Paquets
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server
d-i pkgsel/upgrade select none

# Désactiver popularity-contest
popularity-contest popularity-contest/participate boolean false

# Preuve d'exécution du preseed
d-i preseed/late_command string in-target touch /etc/sae51-preseed-ok

# Redémarrage automatique
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
